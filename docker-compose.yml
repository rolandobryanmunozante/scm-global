services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scm_global}
      POSTGRES_USER: ${POSTGRES_USER:-scm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scm_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - scm_postgres_data:/var/lib/postgresql/data
      - ./database:/database:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc 'SELECT 1' | grep -qx '1'",
        ]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scm_global}
      POSTGRES_USER: ${POSTGRES_USER:-scm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scm_password}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./database/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/rolandobryanmunozante/scm-global-backend:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-scm_user}:${POSTGRES_PASSWORD:-scm_password}@postgres:5432/${POSTGRES_DB:-scm_global}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
      DEMO_MODE: ${DEMO_MODE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SCM Global <no-reply@scm.local>}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry-demo:
    image: node:22-alpine
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    environment:
      SCM_API_URL: http://backend:4000/api
      SCM_DEMO_PASSWORD: ${SCM_DEMO_PASSWORD:-SCM2026!}
      SCM_TELEMETRY_INTERVAL_MS: ${SCM_TELEMETRY_INTERVAL_MS:-15000}
      SCM_TELEMETRY_REQUEST_TIMEOUT_MS: ${SCM_TELEMETRY_REQUEST_TIMEOUT_MS:-5000}
    volumes:
      - ./scripts/simulate-telemetry.mjs:/app/simulate-telemetry.mjs:ro
    command: ["node", "/app/simulate-telemetry.mjs", "--continuous"]

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/rolandobryanmunozante/scm-global-frontend:latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scm_postgres_data:
