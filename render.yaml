services:
  - type: web
    name: scm-global-umsa
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scm-global-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: scm-global-umsa
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEMO_MODE
        value: "true"
      - key: SCM_DEMO_PASSWORD
        value: SCM2026!
      - key: SCM_TELEMETRY_INTERVAL_MS
        value: "15000"

databases:
  - name: scm-global-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: scm_global_demo
    user: scm_user
    ipAllowList: []
