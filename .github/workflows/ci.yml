name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate types, tests and builds
        run: pnpm check

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start the complete stack
        env:
          JWT_SECRET: ci-only-secret-with-at-least-32-characters
          DEMO_MODE: "true"
        run: docker compose up -d --build --wait

      - name: Verify roles and public flows
        run: pnpm verify:system

      - name: Verify purchase, inventory and transport workflows
        run: pnpm verify:workflows

      - name: Verify isolated live demo
        run: pnpm verify:demo

      - name: Verify database integrity
        run: docker compose exec -T postgres psql -U scm_user -d scm_global -v ON_ERROR_STOP=1 -f /database/verify.sql

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop integration stack
        if: always()
        run: docker compose down --volumes
